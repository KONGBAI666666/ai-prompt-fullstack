server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_prompt_db?allowPublicKeyRetrieval=true&useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    # 请替换为你本地 MySQL 的 root 密码（不要把真实密码提交到仓库）
    password: your_password

mybatis-plus:
  configuration:
    # 开发期打印 SQL，便于学习观察
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# CORS 白名单：只允许本地前端跨域，生产环境改为真实域名（多个用逗号分隔）
cors:
  allowed-origins: http://localhost:5173
